name: CI

on:
  push: {}
  pull_request:
    branches: [ 'main', 'master' ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov PyQt6

      - name: Run tests
        run: |
          pytest -q

      - name: Generate test report (Markdown/HTML/CSV)
        run: |
          python scripts/ci_generate_report.py --html --csv

      - name: Upload test reports (MD)
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: reports/test_report_*.md
          if-no-files-found: ignore
      - name: Upload test reports (HTML)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-html
          path: reports/test_report_*.html
      - name: Upload test reports (CSV)
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-reports-csv
          path: reports/test_report_*.csv
          
